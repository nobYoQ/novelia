name: Preview APK
run-name: ARM64 Release preview · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Release preview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      apk-artifact-id: ${{ steps.apk.outputs.artifact-id }}
      info-artifact-id: ${{ steps.build-info.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore shared preview signing key
        env:
          NOVELIA_PREVIEW_KEYSTORE_BASE64: ${{ secrets.NOVELIA_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NOVELIA_PREVIEW_KEYSTORE_BASE64)) {
            throw 'Missing NOVELIA_PREVIEW_KEYSTORE_BASE64. Run scripts/configure-preview-signing.ps1 on the original signing machine.'
          }
          if ($env:NOVELIA_PREVIEW_KEYSTORE_BASE64.Length -gt 48 * 1024) { throw 'Preview keystore Secret is too large.' }
          $keystorePath = Join-Path $env:RUNNER_TEMP 'novelia-preview.keystore'
          if (Test-Path -LiteralPath $keystorePath) { throw 'Refusing to overwrite an existing preview keystore.' }
          $bytes = $null
          try {
            try { $bytes = [Convert]::FromBase64String($env:NOVELIA_PREVIEW_KEYSTORE_BASE64) }
            catch { throw 'Preview keystore Secret is not valid Base64.' }
            if ($bytes.Length -eq 0) { throw 'Preview keystore Secret is empty.' }
            [IO.File]::WriteAllBytes($keystorePath, $bytes)
            ./scripts/configure-preview-signing.ps1 -KeystorePath $keystorePath -CheckOnly
            "NOVELIA_PREVIEW_KEYSTORE_PATH=$keystorePath" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            if ($null -ne $bytes) { [Array]::Clear($bytes, 0, $bytes.Length) }
            $env:NOVELIA_PREVIEW_KEYSTORE_BASE64 = $null
          }

      - name: Read pinned native toolchain
        id: toolchain
        run: |
          $toolchain = ConvertFrom-StringData (Get-Content -LiteralPath 'gradle/ech-native.properties' -Raw -Encoding utf8)
          "ndk-version=$($toolchain.ndkVersion)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;${{ steps.toolchain.outputs.ndk-version }}

      - name: Set up pinned Go
        uses: actions/setup-go@v7
        with:
          go-version-file: native/ech/go.mod
          # Gradle uses outputs/ech-tools instead of Go's default cache locations.
          cache: false

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache native build dependencies
        uses: actions/cache@v6
        with:
          path: |
            outputs/ech-tools/modules
            outputs/ech-tools/cache
            outputs/ech-tools/gopath/bin
          key: ${{ runner.os }}-${{ runner.arch }}-ech-${{ hashFiles('gradle/ech-native.properties', 'native/ech/**/go.mod', 'native/ech/**/go.sum') }}-${{ hashFiles('native/ech/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ech-${{ hashFiles('gradle/ech-native.properties', 'native/ech/**/go.mod', 'native/ech/**/go.sum') }}-

      - name: Build signed Release preview
        env:
          NOVELIA_MIRROR_ACCESS_TOKEN: ${{ secrets.NOVELIA_MIRROR_ACCESS_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # The same pinned test key as the local Release build; missing keys never fall back.
          & ./gradlew --no-daemon --console=plain :app:assembleRelease '-PreleaseSigning=false' '-PlocalReleaseSigning=true' '-PtargetAbi=arm64-v8a'
          if ($LASTEXITCODE -ne 0) { throw "Release build failed with exit code $LASTEXITCODE." }

      - name: Verify and prepare preview artifacts
        id: package
        run: |
          Set-StrictMode -Version Latest
          $PSNativeCommandUseErrorActionPreference = $false
          $apkDirectory = [IO.Path]::GetFullPath('app/build/outputs/apk/release')
          $metadata = Get-Content -LiteralPath (Join-Path $apkDirectory 'output-metadata.json') -Raw -Encoding utf8 | ConvertFrom-Json
          if ($metadata.applicationId -ne 'cc.novelia.app' -or @($metadata.elements).Count -ne 1) {
            throw 'Unexpected Release APK metadata.'
          }
          $element = $metadata.elements[0]
          $apk = [IO.Path]::GetFullPath((Join-Path $apkDirectory $element.outputFile))
          $apkPrefix = $apkDirectory + [IO.Path]::DirectorySeparatorChar
          if (-not $apk.StartsWith($apkPrefix, [StringComparison]::Ordinal) -or
              [IO.Path]::GetExtension($apk) -ne '.apk' -or -not (Test-Path -LiteralPath $apk -PathType Leaf)) {
            throw 'Release APK is missing or outside its output directory.'
          }
          $mapping = 'app/build/outputs/mapping/release/mapping.txt'
          if (-not (Test-Path -LiteralPath $mapping -PathType Leaf)) { throw 'Release R8 mapping is missing.' }
          $apksigner = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0/apksigner'
          $signature = (& $apksigner verify --print-certs $apk 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Release APK signature verification failed.' }
          $expectedCertificate = (Get-Content -LiteralPath 'gradle/preview-signing.sha256' -Raw -Encoding utf8).Trim()
          $certificates = [regex]::Matches($signature, '(?m)^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})\s*$')
          if ($certificates.Count -ne 1 -or $certificates[0].Groups[1].Value.ToLowerInvariant() -ne $expectedCertificate) {
            throw 'Release APK was not signed with the shared preview certificate.'
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($apk)
          try {
            $nativeAbis = @($archive.Entries | Where-Object { $_.FullName -match '^lib/[^/]+/[^/]+\.so$' } |
              ForEach-Object { $_.FullName.Split('/')[1] } | Sort-Object -Unique)
            if ($nativeAbis.Count -ne 1 -or $nativeAbis[0] -ne 'arm64-v8a') {
              throw 'Preview APK must contain only ARM64 native libraries.'
            }
          } finally { $archive.Dispose() }

          $outputDirectory = 'outputs/preview'
          [IO.Directory]::CreateDirectory($outputDirectory) | Out-Null
          $shortCommit = $env:GITHUB_SHA.Substring(0, 7)
          $stem = "Novelia-$($element.versionName)-preview-arm64-v8a-$shortCommit-$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $outputApk = Join-Path $outputDirectory "$stem.apk"
          Copy-Item -LiteralPath $apk -Destination $outputApk
          Copy-Item -LiteralPath $mapping -Destination (Join-Path $outputDirectory "$stem-mapping.txt")
          $hash = (Get-FileHash -LiteralPath $outputApk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $stem.apk" | Set-Content -LiteralPath "$outputApk.sha256" -Encoding utf8NoBOM
          @(
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "run=$env:GITHUB_RUN_NUMBER"
            "attempt=$env:GITHUB_RUN_ATTEMPT"
            "versionName=$($element.versionName)"
            "versionCode=$($element.versionCode)"
            'variant=release'
            'abi=arm64-v8a'
            'signing=shared-preview-test-certificate'
            "certificateSha256=$expectedCertificate"
          ) | Set-Content -LiteralPath (Join-Path $outputDirectory "$stem-build-info.txt") -Encoding utf8NoBOM
          "apk-path=$outputApk" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact-name=$stem" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload preview APK
        id: apk
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.apk-path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum, build info and R8 mapping
        id: build-info
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact-name }}-build-info
          path: |
            outputs/preview/*.sha256
            outputs/preview/*-build-info.txt
            outputs/preview/*-mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Add download links to build summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
          BUILD_INFO_URL: ${{ steps.build-info.outputs.artifact-url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          @(
            'ARM64 Release 预览包已构建，包含 R8 压缩与资源收缩，与本地构建共用固定预览测试证书。'
            ''
            "[下载 APK]($env:APK_URL) · [下载校验文件、构建信息和 R8 映射]($env:BUILD_INFO_URL)"
            ''
            '产物保留 14 天，下载需要登录 GitHub。同签名本地包可覆盖安装，新包版本码须不低于已安装版本。'
            $(if ($env:GITHUB_REF -eq "refs/heads/$env:DEFAULT_BRANCH") {
              '默认分支构建：接下来由 Update preview Pre-release 任务发布，结果请查看该任务。'
            } else {
              '当前为非默认分支：仅保留 Actions 下载产物，不更新 Pre-release。'
            })
          ) | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Remove temporary signing key
        if: always()
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP 'novelia-preview.keystore'
          if (Test-Path -LiteralPath $keystorePath -PathType Leaf) {
            Remove-Item -LiteralPath $keystorePath -Force
          }

  publish:
    name: Update preview Pre-release
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: preview-prerelease
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout publication script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download this build's verified artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.apk-artifact-id }},${{ needs.build.outputs.info-artifact-id }}
          path: outputs/publish-preview
          merge-multiple: true

      - name: Create or update rolling Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREVIEW_RELEASE_TAG: ${{ vars.NOVELIA_PREVIEW_TAG || 'preview' }}
        run: ./scripts/publish-preview.ps1 -ArtifactsDirectory 'outputs/publish-preview' -Tag $env:PREVIEW_RELEASE_TAG
